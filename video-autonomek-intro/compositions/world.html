  <script>
    const tl = gsap.timeline({ paused: true });

    // Helper: enfoca un punto (wx, wy) en el centro seguro (540, 735) con escala s y parallax sincronizado
    function camKey(wx, wy, s) {
      const x = 540 - wx * s;
      const y = 735 - wy * s;
      return {
        world: { x: x, y: y, scale: s },
        grid: { x: x * 0.32, y: y * 0.32, scale: 1 + (s - 1) * 0.22 },
        fg: { x: x * 1.18, y: y * 1.18, scale: s },
      };
    }

    function moveCamera(atSec, durationSec, wx, wy, s, easeName) {
      const k = camKey(wx, wy, s);
      tl.to("#world-stage", { x: k.world.x, y: k.world.y, scale: k.world.scale, duration: durationSec, ease: easeName }, atSec);
      tl.to("#bg-grid-parallax", { x: k.grid.x, y: k.grid.y, scale: k.grid.scale, duration: durationSec, ease: easeName }, atSec);
      tl.to("#fg-parallax", { x: k.fg.x, y: k.fg.y, scale: k.fg.scale, duration: durationSec, ease: easeName }, atSec);
    }

    // =========================================================================
    // ESTADO INICIAL (t = 0.00s): Plano muy cercano al emblema de Autonomek
    // =========================================================================
    const k0 = camKey(900, 570, 2.55);
    tl.set("#world-stage", k0.world, 0);
    tl.set("#bg-grid-parallax", k0.grid, 0);
    tl.set("#fg-parallax", k0.fg, 0);
    tl.set("#st2-speed-bar", { scaleX: 0.12 }, 0);

    // Flujo determinista de líneas de luz en los conductos externos (Escena 4)
    tl.fromTo("#pulse-1, #pulse-3", { strokeDashoffset: 610 }, { strokeDashoffset: -1830, duration: 9, ease: "none" }, 24.4);
    tl.fromTo("#pulse-2, #pulse-4", { strokeDashoffset: 400 }, { strokeDashoffset: -2040, duration: 9, ease: "none" }, 24.4);

    // Orbes luminosos viajando por los cables curvos del flujo vivo (#flow-hero-svg)
    function bindOrbToPath(orbId, haloId, pathId, startSec, durationSec, cycles, phaseOffset) {
      const path = document.getElementById(pathId);
      const orb = document.getElementById(orbId);
      const halo = document.getElementById(haloId);
      if (!path || !orb || !halo) return;
      const len = path.getTotalLength();
      const state = { t: phaseOffset || 0 };
      const updatePos = () => {
        const p = ((state.t % 1) + 1) % 1;
        const pt = path.getPointAtLength(p * len);
        const fade = Math.min(1, Math.sin(p * Math.PI) * 2.4);
        orb.setAttribute("cx", pt.x.toFixed(1));
        orb.setAttribute("cy", pt.y.toFixed(1));
        orb.setAttribute("opacity", fade.toFixed(2));
        halo.setAttribute("cx", pt.x.toFixed(1));
        halo.setAttribute("cy", pt.y.toFixed(1));
        halo.setAttribute("opacity", (fade * 0.28).toFixed(2));
      };
      updatePos();
      tl.to(state, { t: (phaseOffset || 0) + cycles, duration: durationSec, ease: "none", onUpdate: updatePos }, startSec);
    }

    bindOrbToPath("orb-l1", "orb-l1-halo", "wire-l1", 24.8, 16.7, 7.5, 0.05);
    bindOrbToPath("orb-l2", "orb-l2-halo", "wire-l2", 24.8, 16.7, 7.5, 0.52);
    bindOrbToPath("orb-r1", "orb-r1-halo", "wire-r1", 24.8, 16.7, 7.5, 0.28);
