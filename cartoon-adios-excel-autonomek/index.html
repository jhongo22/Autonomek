<!doctype html>
<html
  lang="es"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Fondo concreto","default":"#F4F4F5"},
    {"id":"color-ink","type":"color","label":"Contorno tinta","default":"#18181B"},
    {"id":"color-yellow","type":"color","label":"Amarillo precaución","default":"#FACC15"},
    {"id":"color-green","type":"color","label":"Verde Excel / Esmeralda","default":"#16A34A"},
    {"id":"color-red","type":"color","label":"Rojo alarma","default":"#EF4444"},
    {"id":"color-orange","type":"color","label":"Naranja mecánico","default":"#F97316"},
    {"id":"color-blue","type":"color","label":"Azul titanio","default":"#2563EB"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #F4F4F5;
        --color-ink: #18181B;
        --color-yellow: #FACC15;
        --color-green: #16A34A;
        --color-red: #EF4444;
        --color-orange: #F97316;
        --color-blue: #2563EB;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="38"
      data-fps="30"
      data-width="1080"
      data-height="1920"
    >
      <!-- Scene Sub-compositions -->
      <div
        id="scene1"
        class="clip"
        data-composition-id="scene1"
        data-composition-src="compositions/scene1.html"
        data-start="0"
        data-duration="8.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1;"
      ></div>
      <div
        id="scene2"
        class="clip"
        data-composition-id="scene2"
        data-composition-src="compositions/scene2.html"
        data-start="8.55"
        data-duration="7.75"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2;"
      ></div>
      <div
        id="scene3"
        class="clip"
        data-composition-id="scene3"
        data-composition-src="compositions/scene3.html"
        data-start="16.3"
        data-duration="13.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3;"
      ></div>
      <div
        id="scene4"
        class="clip"
        data-composition-id="scene4"
        data-composition-src="compositions/scene4.html"
        data-start="30.1"
        data-duration="7.9"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 4;"
      ></div>

      <!-- Narración Álvaro (es-ES-AlvaroNeural, +0%) -->
      <audio
        id="vo1"
        class="clip"
        src="assets/audio/voice/vo_1_sync.mp3"
        data-start="0.15"
        data-duration="8.3"
        data-volume="1.05"
        data-track-index="2"
      ></audio>
      <audio
        id="vo2"
        class="clip"
        src="assets/audio/voice/vo_2_sync.mp3"
        data-start="9.05"
        data-duration="6.83"
        data-volume="1.05"
        data-track-index="2"
      ></audio>
      <audio
        id="vo3"
        class="clip"
        src="assets/audio/voice/vo_3_sync.mp3"
        data-start="16.65"
        data-duration="12.93"
        data-volume="1.05"
        data-track-index="2"
      ></audio>
      <audio
        id="vo4"
        class="clip"
        src="assets/audio/voice/vo_4_sync.mp3"
        data-start="30.35"
        data-duration="7.18"
        data-volume="1.05"
        data-track-index="2"
      ></audio>

      <!-- Música de fondo industrial rítmica con ducking / voiceover carve -->
      <audio
        id="bgm-factory"
        class="clip"
        src="assets/audio/bgm/factory_groove.mp3"
        data-start="0"
        data-duration="38"
        data-volume="0.18"
        data-fade-in="0.25"
        data-fade-out="1.4"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.95},{&quot;t&quot;:0.15,&quot;v&quot;:0.65},{&quot;t&quot;:8.45,&quot;v&quot;:0.9},{&quot;t&quot;:9.05,&quot;v&quot;:0.65},{&quot;t&quot;:15.88,&quot;v&quot;:0.95},{&quot;t&quot;:16.65,&quot;v&quot;:0.65},{&quot;t&quot;:29.58,&quot;v&quot;:0.95},{&quot;t&quot;:30.35,&quot;v&quot;:0.65},{&quot;t&quot;:37.53,&quot;v&quot;:0.95}]}]}"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;peaking&quot;,&quot;id&quot;:&quot;carve1&quot;,&quot;label&quot;:&quot;Voiceover Carve Mid&quot;,&quot;params&quot;:{&quot;frequency&quot;:1800,&quot;gain&quot;:-4.5,&quot;q&quot;:1.1}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;lim1&quot;,&quot;params&quot;:{&quot;limit&quot;:-2}}]}"
        data-track-index="3"
      ></audio>

      <!-- SFX Sincronizados: Escena 1 -->
      <audio id="sfx-siren" class="clip" src="assets/audio/sfx/sfx_siren.mp3" data-start="0.02" data-duration="1.1" data-volume="0.38" data-track-index="4"></audio>
      <audio id="sfx-crate" class="clip" src="assets/audio/sfx/sfx_crate_crash.mp3" data-start="0.08" data-duration="0.85" data-volume="0.44" data-track-index="5"></audio>
      <audio id="sfx-sparks" class="clip" src="assets/audio/sfx/sfx_sparks.mp3" data-start="2.48" data-duration="0.9" data-volume="0.42" data-track-index="4"></audio>
      <audio id="sfx-glitch1" class="clip" src="assets/audio/sfx/glitch-1.mp3" data-start="2.52" data-duration="0.7" data-volume="0.28" data-track-index="5"></audio>
      <audio id="sfx-err1" class="clip" src="assets/audio/sfx/error.mp3" data-start="4.46" data-duration="1.1" data-volume="0.32" data-track-index="4"></audio>
      <audio id="sfx-pop1" class="clip" src="assets/audio/sfx/pop.mp3" data-start="4.54" data-duration="0.72" data-volume="0.46" data-track-index="5"></audio>

      <!-- SFX Sincronizados: Escena 2 -->
      <audio id="sfx-whip" class="clip" src="assets/audio/sfx/whoosh-short.mp3" data-start="8.78" data-duration="0.57" data-volume="0.48" data-track-index="4"></audio>
      <audio id="sfx-coins" class="clip" src="assets/audio/sfx/sfx_coins_suck.mp3" data-start="11.25" data-duration="1.6" data-volume="0.42" data-track-index="5"></audio>
      <audio id="sfx-lock" class="clip" src="assets/audio/sfx/error.mp3" data-start="13.55" data-duration="1.1" data-volume="0.35" data-track-index="4"></audio>
      <audio id="sfx-pop2" class="clip" src="assets/audio/sfx/pop.mp3" data-start="13.95" data-duration="0.72" data-volume="0.42" data-track-index="5"></audio>

      <!-- SFX Sincronizados: Escena 3 -->
      <audio id="sfx-slam" class="clip" src="assets/audio/sfx/sfx_hydraulic_slam.mp3" data-start="16.70" data-duration="1.1" data-volume="0.46" data-track-index="4"></audio>
      <audio id="sfx-bass" class="clip" src="assets/audio/sfx/impact-bass-1.mp3" data-start="17.20" data-duration="1.4" data-volume="0.42" data-track-index="5"></audio>
      <audio id="sfx-turbine" class="clip" src="assets/audio/sfx/sfx_turbine_start.mp3" data-start="17.45" data-duration="1.8" data-volume="0.35" data-track-index="6"></audio>
      <audio id="sfx-pop3" class="clip" src="assets/audio/sfx/pop.mp3" data-start="20.45" data-duration="0.72" data-volume="0.44" data-track-index="4"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/audio/sfx/sfx_pneumatic_stamp.mp3" data-start="22.58" data-duration="0.55" data-volume="0.52" data-track-index="4"></audio>
      <audio id="sfx-chime" class="clip" src="assets/audio/sfx/chime.mp3" data-start="24.52" data-duration="1.7" data-volume="0.40" data-track-index="5"></audio>
      <audio id="sfx-ping" class="clip" src="assets/audio/sfx/ping.mp3" data-start="24.72" data-duration="1.0" data-volume="0.36" data-track-index="6"></audio>
      <audio id="sfx-sparkle" class="clip" src="assets/audio/sfx/sparkle.mp3" data-start="26.75" data-duration="1.5" data-volume="0.38" data-track-index="4"></audio>

      <!-- SFX Sincronizados: Escena 4 -->
      <audio id="sfx-whoosh4" class="clip" src="assets/audio/sfx/whoosh.mp3" data-start="30.08" data-duration="0.57" data-volume="0.44" data-track-index="4"></audio>
      <audio id="sfx-click4" class="clip" src="assets/audio/sfx/click.mp3" data-start="30.40" data-duration="0.37" data-volume="0.38" data-track-index="5"></audio>
      <audio id="sfx-notif" class="clip" src="assets/audio/sfx/notification.mp3" data-start="33.65" data-duration="1.5" data-volume="0.40" data-track-index="4"></audio>
      <audio id="sfx-chord" class="clip" src="assets/audio/sfx/sfx_final_chord.mp3" data-start="35.80" data-duration="2.2" data-volume="0.46" data-track-index="5"></audio>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
