  <script>
    const tl = gsap.timeline({ paused: true });

    // Rig de cámara virtual: enfoca (wx, wy) en centro seguro móvil (510, 740)
    function camKey(wx, wy, s) {
      const x = 510 - wx * s;
      const y = 740 - wy * s;
      return {
        world: { x: x, y: y, scale: s },
        grid: { x: x * 0.32, y: y * 0.32, scale: 1 + (s - 1) * 0.2 },
        fg: { x: x * 1.15, y: y * 1.15, scale: s },
      };
    }

    function moveCamera(atSec, durSec, wx, wy, s, easeName) {
      const k = camKey(wx, wy, s);
      tl.to("#world-stage", { x: k.world.x, y: k.world.y, scale: k.world.scale, duration: durSec, ease: easeName }, atSec);
      tl.to("#bg-grid-parallax", { x: k.grid.x, y: k.grid.y, scale: k.grid.scale, duration: durSec, ease: easeName }, atSec);
      tl.to("#fg-parallax", { x: k.fg.x, y: k.fg.y, scale: k.fg.scale, duration: durSec, ease: easeName }, atSec);
    }

    // =========================================================================
    // FRAME 0 (0.00s): VISIBLE DESDE EL FOTOGRAMA 1 (SIN FADE-IN)
    // =========================================================================
    const kStart = camKey(800, 860, 1.0);
    tl.set("#world-stage", kStart.world, 0);
    tl.set("#bg-grid-parallax", kStart.grid, 0);
    tl.set("#fg-parallax", kStart.fg, 0);
    tl.set("#b1-receipt-line", { scaleX: 1 }, 0);
    tl.set("#b3-mk-fill", { scaleX: 0 }, 0);

    // =========================================================================
    // BEAT 1: EL DOLOR EN EL FRAME 0 [0.00s - 7.70s]
    // Audio Álvaro: 0.10s -> 7.10s ("Pagaste por una página web hace meses...")
    // =========================================================================
    // 0.50s - 2.80s: Línea plana roja avanza en vivo + reloj digital Mes 1 -> Mes 6

      "#b1-flatline-path",
      { strokeDashoffset: 830 },
      { strokeDashoffset: 0, duration: 2.30, ease: "none" },
      0.50,
    );
    tl.fromTo(
      "#b1-flatline-dot",
      { attr: { cx: 8 } },
      { attr: { cx: 824 }, duration: 2.30, ease: "none" },
      0.50,
    );

    const monthClockEl = document.getElementById("b1-month-clock");
    const monthState = { m: 1 };
    tl.to(
      monthState,
      {
        m: 6,
        duration: 2.00,
        ease: "none",
        onUpdate: () => {
          monthClockEl.textContent = "Mes " + Math.min(6, Math.max(1, Math.floor(monthState.m + 0.001)));

      0.50,

    // 3.15s: Texto de apoyo ("Bonita por fuera. / Invisible por dentro.") - sin rebote, queda quieto

      "#b1-support-copy",
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.28, ease: "power4.out" },
      3.15,

    // 5.40s: Acercamiento dramático (expo.out) hacia el número "0"

    // =========================================================================
    // BEAT 2: INVISIBLE EN CHATGPT Y GOOGLE [7.70s - 19.20s]
    // Audio Álvaro: 7.90s -> 18.56s ("Cuando alguien pregunta en ChatGPT...")
    // =========================================================================
    // 7.70s: Whip-pan lateral rápido (0.30s) hacia estación 2

    // 8.10s - 10.60s: Escritura en vivo letra por letra en ChatGPT

    const typedEl = document.getElementById("b2-typed-text");
    const typeState = { idx: 0 };

      typeState,
      {
        idx: promptQuery.length,
        duration: 2.50,
        ease: "none",
        onUpdate: () => {
          typedEl.textContent = promptQuery.slice(0, Math.round(typeState.idx));

      8.10,

    // Parpadeo determinista del cursor y cierre limpio antes de la respuesta IA
    tl.set("#b2-typed-caret", { opacity: 1 }, 10.65);
    tl.set("#b2-typed-caret", { opacity: 0 }, 10.95);

    // 11.15s: Aparece la respuesta de la IA recomendando Competidor A y B

      "#b2-ai-response",
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.26, ease: "power4.out" },

      "#b2-not-rec-stamp",
      { opacity: 0, scale: 1.18 },
      { opacity: 1, scale: 1.0, duration: 0.22, ease: "power4.out" },

    // 14.20s - 16.00s: Scroll del listado Google hasta Página 4

      "#b2-serp-list",
      { y: 0 },
      { y: -115, duration: 1.75, ease: "power2.inOut" },

    // Salida del zoom ya dentro de Estación 3 (cx=4050, cy=920)

    tl.set("#world-stage", camKey(4050, 920, 1.38).world, 19.40);

    tl.set("#fg-parallax", camKey(4050, 920, 1.38).fg, 19.40);
    moveCamera(19.40, 0.22, 4050, 920, 1.0, "expo.out");
    tl.to("#cinematic-zoom-flash", { opacity: 0, duration: 0.26, ease: "power2.out" }, 19.40);

    // Sello INGENIERÍA AUTONOMEK y tarjeta mk-progress-stat aterrizan fijos

    tl.fromTo("#b3-audit-card", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.30, ease: "power4.out" }, 19.60);

    // 21.40s - 26.50s: Arranque de diagnóstico en vivo (21.40s -> 24.00s) + impulso final a 99/100 (24.10s -> 26.50s)
    const speedNumEl = document.getElementById("b3-mk-num");
    const speedState = { score: 0 };

      speedState,
      {
        score: 24,
        duration: 2.30,
        ease: "power2.out",
        onUpdate: () => {
          speedNumEl.textContent = Math.round(speedState.score) + "/100";

      21.40,
    );
    tl.to("#b3-mk-fill", { scaleX: 0.24, duration: 2.30, ease: "power2.out" }, 21.40);
    tl.to(
      speedState,
      {
        score: 99,
        duration: 2.40,
        ease: "power2.out",
        onUpdate: () => {
          speedNumEl.textContent = Math.round(speedState.score) + "/100";

      24.10,

    tl.to("#b3-mk-fill", { scaleX: 0.99, duration: 2.40, ease: "power2.out" }, 24.10);

    tl.fromTo(
      "#b3-time-badge",
      { opacity: 0, scale: 1.08 },
      { opacity: 1, scale: 1.0, duration: 0.20, ease: "power4.out" },
